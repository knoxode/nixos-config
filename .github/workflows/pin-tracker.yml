name: Maintenance — Track Pinned Packages

# Opens an issue for each "pin: <pkg> — Revert when ..." commit in the last
# 30 days. Runs on every push to main, weekly, and on demand. Close the issue
# when the pin is removed. See docs/operations/ci.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  track-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need history for the commit scan

      - name: Open or update a pin issue
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');

            // Rescan a rolling window on every run. Idempotent: issues are
            // matched by title, so daily lock merges do not duplicate them.
            const args = ['log', '--format=%H%x09%s', '--since=30 days ago'];
            // Commit subjects use the convention "pin: <pkg> — Revert when ...".
            // Match the subject prefix, not any "Revert when" text in a body
            // (failure-analysis docs mention the phrase too).
            args.push('--grep=^pin:');

            let output = '';
            try {
              output = execFileSync('git', args, { encoding: 'utf8' }).trim();
            } catch {}

            const commits = output
              .split('\n')
              .filter(Boolean)
              .map((line) => {
                const [sha, ...subject] = line.split('\t');
                return { sha, subject: subject.join('\t') };
              })
              .filter((c) => /^pin:/i.test(c.subject));

            if (commits.length === 0) {
              core.info('No pin commits to track.');
              return;
            }

            // Existing workflow-created issues, keyed by title.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
              per_page: 100,
            });
            const byTitle = new Map(
              issues.filter((i) => !i.pull_request).map((i) => [i.title, i]),
            );

            for (const commit of commits) {
              const match = commit.subject.match(/^pin:\s*(.+?)(?:\s+[—-]\s+|$)/i);
              const pkg = (match?.[1] || commit.subject).trim();
              const title = `Pinned: ${pkg}`;
              const body =
                `## Pinned package: \`${pkg}\`\n\n` +
                `Commit: [\`${commit.sha.slice(0, 8)}\`](${context.serverUrl}/` +
                `${context.repo.owner}/${context.repo.repo}/commit/${commit.sha}) — ` +
                `${commit.subject}\n\n` +
                `This package is pinned pending an upstream fix; the commit ` +
                `records the removal criterion. Close this issue when the pin ` +
                `is removed.\n\n` +
                `*Opened automatically by the pin tracker.*`;

              const existing = byTitle.get(title);
              if (existing) {
                if (existing.body === body) {
                  core.info(`Up to date: #${existing.number} ${title}`);
                } else {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    body,
                  });
                  core.info(`Updated #${existing.number}: ${title}`);
                }
              } else {
                const { data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['automated'],
                });
                byTitle.set(title, issue);
                core.info(`Created #${issue.number}: ${title}`);
              }
            }
