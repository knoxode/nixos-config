name: CI — Evaluate & Build Hosts

# Phases covered by this workflow:
#
#   changes -> decide whether builds are needed (lock PRs / manual runs;
#              config-only PRs skip straight to a green gate).
#   eval    -> every host must still evaluate (cheap required gate; never builds).
#   build   -> lock-PR / manual builds. Each build publishes to
#              alexos.cachix.org unconditionally: the full closure on success,
#              or just the constituents that built before a failure (cachix
#              skips paths already in the cache). A squash merge has the same
#              tree as its lock PR, so the cache is warm exactly when it
#              matters and nothing rebuilds on main afterwards.
#   gates   -> stable aggregate required checks for branch protection.
#
# Job names `Evaluate <host>` (x3), `Evaluate gate`, `Build <host>` (x3) and
# `Build gate` are required status checks — do not rename them.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine whether builds are needed
    runs-on: ubuntu-latest
    outputs:
      lock: ${{ steps.filter.outputs.lock }}
    steps:
      - name: Detect flake.lock changes (config-only PRs skip builds)
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            lock:
              - 'flake.lock'

  eval:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [reuby, node, nomad]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Restore the store instead of re-fetching the same flake inputs on
      # all three runners. Keyed on flake.lock, so a lock bump re-primes it.
      - name: Restore nix store (flake inputs cached per flake.lock)
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: eval-${{ matrix.host }}-v1-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: eval-v1-
          # Respect the 10 GB repo-wide GHA cache cap shared across all jobs.
          gc-max-store-size: 3G

      # Eval stops at the derivation path: proves the config still evaluates,
      # realizes nothing.
      - name: Evaluate ${{ matrix.host }} closure (derivation only, no build)
        run: |
          nix eval \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  eval-gate:
    name: Evaluate gate
    needs: [eval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate evaluation results (required check)
        env:
          RESULT: ${{ needs.eval.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Evaluation result: $RESULT"
            exit 1
          fi
          echo "All host evaluations succeeded."

  build:
    name: Build ${{ matrix.host }}
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       needs.changes.result == 'success' &&
       needs.changes.outputs.lock == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [reuby, node, nomad]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Prior lock-PR builds warm this; the store carries across runs even
      # when only a fix commit (not flake.lock) changed.
      - name: Restore nix store (prior lock-PR builds warm this)
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: build-${{ matrix.host }}-v1-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: build-v1-
          # A full closure exceeds 10 GB, so GC keeps this entry bounded;
          # store paths beyond the cap are covered by the cachix push below.
          gc-max-store-size: 10G

      - name: Set alexos.cachix.org as binary-cache source (pull-only)
        uses: cachix/cachix-action@v17
        with:
          name: alexos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Free runner disk for closure builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          df -h /

      - name: Save base flake.lock for compare
        if: github.event_name == 'pull_request'
        run: cp flake.lock flake.lock.base

      - name: Build ${{ matrix.host }} system closure & publish new paths to alexos.cachix.org
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set +e
          nix build --keep-going --log-format internal-json --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" 2>&1 | tee build.jsonl
          status=$?
          set -e

          # Publish on success *and* salvage on failure: `nix path-info --all`
          # offers cachix the whole runner store and cachix skips every path
          # already in the cache. Result: the full closure uploads when green;
          # when red, just the constituents that built — which retry builds
          # (and any other consumer) then pull instead of rebuilding. The
          # Build gate — not the cache — owns what reaches main.
          nix path-info --all | cachix push alexos

          # Preserve the real build result so Build gate stays honest.
          exit $status

      - name: Analyze build failure & post PR comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.jsonl', 'utf8');
            
            // Parse internal-json lines for failed derivations
            const failures = log.split('\n')
              .filter(line => line.trim())
              .map(line => JSON.parse(line))
              .filter(e => e.action === 'build' && e.status === 'failed');
            
            if (failures.length === 0) {
              core.setFailed('No failed derivations found in log');
              return;
            }
            
            // Extract old/new nixpkgs revs from flake.lock (base vs HEAD)
            const lock = JSON.parse(fs.readFileSync('flake.lock', 'utf8'));
            const newRev = lock.nodes.nixpkgs.locked.rev;
            let oldRev = newRev;
            try {
              const baseLock = JSON.parse(fs.readFileSync('flake.lock.base', 'utf8'));
              oldRev = baseLock.nodes.nixpkgs.locked.rev;
            } catch {}
            
            // Build markdown summary
            let md = `## Build Failed: ${{ matrix.host }}\n\n`;
            md += `**Failed derivations (${failures.length}):**\n\n`;
            for (const f of failures) {
              const drv = f.drvPath || 'unknown';
              const name = drv.match(/([^\/]+)\.drv$/)?.[1] || drv;
              const exitCode = f.exitCode || '?';
              md += `- \`${name}\` (exit code ${exitCode})\n`;
              md += `  - Derivation: \`${drv}\`\n`;
              const logOutput = await exec(`nix log ${drv} 2>&1 | tail -30`);
              md += `  - Last log lines:\n\`\`\`\n${logOutput.stdout}\n\`\`\`\n`;
            }
            
            if (oldRev !== newRev) {
              md += `**Upstream nixpkgs range:** [${oldRev.slice(0,8)}...${newRev.slice(0,8)}](https://github.com/NixOS/nixpkgs/compare/${oldRev}...${newRev})\n\n`;
            }
            
            md += `**Suggested fix:** Add to \`hosts/${{ matrix.host }}/overrides.nix\`:\n`;
            md += `\`\`\`nix\n{ pkgs, ... }:\n{ nixpkgs.overlays = [ (self: super: { } ) ]; }\n\`\`\`\n`;
            md += `Commit with message: \`pin: <pkg> — Revert when nixpkgs#<PR> lands\`\n`;
            
            // Write to job summary
            await core.summary.addRaw(md).write();
            
            // Post/update PR comment
            if (context.payload.pull_request) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Build Failed:'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: botComment.id, body: md
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number, body: md
                });
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.FLAKE_UPDATE_PAT }}

  build-gate:
    name: Build gate
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate build results (required check)
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LOCK_CHANGED: ${{ needs.changes.outputs.lock }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          # Fail closed if PR change detection failed.
          if [ "$EVENT" = "pull_request" ] &&
             [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Lock change detection failed."
            exit 1
          fi

          # Builds are mandatory for lock PRs and manual runs.
          if [ "$EVENT" = "workflow_dispatch" ] ||
             { [ "$EVENT" = "pull_request" ] &&
               [ "$LOCK_CHANGED" = "true" ]; }; then
            if [ "$BUILD_RESULT" != "success" ]; then
              echo "::error::Required builds: $BUILD_RESULT"
              exit 1
            fi
            echo "All required host builds succeeded."
          else
            # No builds required for this event.
            if [ "$BUILD_RESULT" != "skipped" ]; then
              echo "::error::Unexpected build result: $BUILD_RESULT"
              exit 1
            fi
            echo "Builds correctly skipped."
          fi
