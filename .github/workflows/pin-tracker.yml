name: Maintenance — Track Pinned Packages

# Weekly scan for overlay commits with "Revert when" in message.
# Posts summary to a tracking issue so pinned packages don't drift silently.

on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  track-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for log search

      - name: Search for active pins in recent commits
        id: search
        run: |
          git log --oneline --since="30 days ago" --grep="Revert when" --all > pins.txt || true
          
          if [ ! -s pins.txt ]; then
            echo "pins_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "pins_found=true" >> $GITHUB_OUTPUT
          echo "pins_log<<EOF" >> $GITHUB_OUTPUT
          cat pins.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          cat pins.txt

      - name: Create or update tracking issue
        if: steps.search.outputs.pins_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pinned-packages',
              per_page: 10
            });
            
            const trackingIssue = issues.find(i => i.title === 'Tracking: Pinned packages awaiting upstream fix');
            const body = `## Active Pinned Packages (last 30 days)\n\n` +
              `Automated weekly scan — commits with "Revert when" in message:\n\n` +
              `\`\`\`\n${process.env.PINS_LOG}\n\`\`\`\n\n` +
              `---\n` +
              `**Action needed:** For each pin, check the linked nixpkgs PR/commit range. ` +
              `When fixed, revert the overlay commit and push to main.\n` +
              `*Last scan: ${new Date().toISOString().split('T')[0]}*`;
            
            if (trackingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: trackingIssue.number,
                body: body
              });
              core.info(`Updated tracking issue #${trackingIssue.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Tracking: Pinned packages awaiting upstream fix',
                body: body,
                labels: ['pinned-packages', 'maintenance']
              });
              core.info(`Created tracking issue #${issue.number}`);
            }
        env:
          PINS_LOG: ${{ steps.search.outputs.pins_log }}

      - name: Close tracking issue if no pins
        if: steps.search.outputs.pins_found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pinned-packages',
              per_page: 10
            });
            
            const trackingIssue = issues.find(i => i.title === 'Tracking: Pinned packages awaiting upstream fix');
            if (trackingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: trackingIssue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed tracking issue #${trackingIssue.number} — no active pins`);
            } else {
              core.info('No tracking issue to close');
            }