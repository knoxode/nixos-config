name: Push to Cachix

# Pushes system closure build outputs to alexos.cachix.org after successful builds.
# Triggers on Check workflow completion (lock PRs + manual dispatches only).
# Also manually triggerable for testing.
# Deduplicates automatically across hosts via content-addressed store paths.

on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:  # enables manual trigger from Actions UI / gh CLI

permissions:
  contents: read

jobs:
  should-push:
    name: Determine if push needed
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.check.outputs.push }}
    steps:
      - name: Check if Check workflow succeeded and was a lock PR or manual
        id: check
        run: |
          EVENT="${{ github.event.workflow_run.event }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          # For manual dispatch, always push
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Push only if Check succeeded AND (lock PR or manual dispatch)
          if [ "$CONCLUSION" = "success" ] && \
             { [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            # For PRs, check if flake.lock changed
            if [ "$EVENT" = "pull_request" ]; then
              PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
              # Use gh to check if flake.lock was in the PR
              if gh pr view "$PR_NUM" --json files --jq '.files[].path' | grep -q '^flake\.lock$'; then
                echo "push=true" >> $GITHUB_OUTPUT
              else
                echo "push=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "push=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  push-cache:
    name: Push host closures to alexos.cachix.org
    needs: should-push
    if: needs.should-push.outputs.push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [reuby, node, nomad]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Configure Cachix (push to alexos, pull from declared substituters)
        uses: cachix/cachix-action@v17
        with:
          name: alexos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # extraPullNames only accepts Cachix caches; cache.nixos.org etc. are
          # configured via NixOS module (modules/core/system.nix)
          # Only push the final system toplevel closure (transitive deps included)
          pathsToPush: ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: Build ${{ matrix.host }} toplevel (pushes to cache via post-build hook)
        run: |
          nix build --no-link --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
