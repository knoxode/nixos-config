background {
    monitor =
    path = /home/shaiikura/Documents/syncthing/asr/DesktopBackground/wallhaven-2yp6gg.png
    color = rgba(25, 20, 20, 1.0)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 1 # 0 disables blurring
    blur_size = 1
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.30
    vibrancy_darkness = 1
}

general {
  hide_cursor = true
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = false
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    font_family = JetBrains Mono Nerd Font
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Type Your Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off

    position = 0, 100
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Hi there, Alex!
    color = rgba(200, 200, 200, 1.0)
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, 210
    halign = center
    valign = center
}

# Current time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big><span color='white'>$(date +"%H"):</span><span color='gray'>$(date +"%M")</span></big></b>"
    color = white
    font_size = 128
    font_family = JetBrains Mono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%A"), $(date +"%d %b %Y") </big></b>"
    color = $color3
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> Alex Ryder </big></b>"
    color = $color3
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, 165
    halign = center
    valign = bottom
}

image {
    monitor =
    path = ~/Documents/syncthing/asr/assets_for_desktop/hyprlock/GettyImages-1278848447-32a8c2139b6741b6978d0bfb97839dde.jpg
    border_color = 0xffdddddd
    border_size = 0
    size = 125
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 200
    halign = center
    valign = bottom
}

label {
  monitor =
  text = cmd[update:1000] echo "$(~/.config/hypr/scripts/wifi-status.sh)"
  color = rgba(242, 243, 244, 0.75)
  font_size = 16
  font_family = JetBrains Mono Nerd Font
  position = -30, -30
  halign = right
