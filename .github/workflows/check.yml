name: Check

# Evaluates every host against the committed flake.lock on every push, on all
# PRs, and once a day. Evaluation errors and failed
# assertions fail the job; evaluation warnings are visible in the log.
#
# This catches "will my config still evaluate" breakage cheaply, and the
# build job proves on every PR that the full system closures still build -
# so anything merged to main is known to evaluate and build.
on:
  push: # any branch - no coupling to what the default branch is called
  pull_request:
  schedule:
    # daily at 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [reuby, node, nomad]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Evaluate ${{ matrix.host }} toplevel
        run: |
          nix eval ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    # Only for the daily flake.lock PRs (labeled "flake-lock" by
    # update-flake-lock) and manual runs. Config PRs stay eval-only and fast;
    # the build jobs show as skipped there, which satisfies the required
    # status checks, so merges still only need the evals.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'flake-lock'))
    strategy:
      fail-fast: false
      matrix:
        host: [reuby, node, nomad]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          df -h /

      - name: Build ${{ matrix.host }} toplevel
        run: |
          nix build --no-link --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # Stable-named aggregate over the build matrix, required as a status check.
  # Required per-host matrix checks can't work: when every combination is
  # skipped (config PRs), GitHub collapses them into a single un-interpolated
  # check ("Build ${{ matrix.host }}"), so the required names never appear and
  # merges block forever. This gate passes when builds succeeded or were
  # skipped, and fails if any host build failed.
  build-gate:
    name: Build gate
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          result='${{ needs.build.result }}'
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "build job result: $result"
          else
            echo "::error::build job failed: $result"
            exit 1
          fi
