name: Maintenance — Track Pinned Packages

# Opens an issue for each "pin: <pkg> — Revert when ..." commit in the last
# 30 days, and closes it when a later "unpin: <pkg> ..." commit lands. Runs on
# every push to main, weekly, and on demand. See docs/operations/ci.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  track-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need history for the commit scan

      - name: Open or update a pin issue
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');

            // Rescan a rolling window on every run. Idempotent: issues are
            // matched by title, so daily lock merges do not duplicate them.
            const args = [
              'log',
              '--format=%H%x09%s',
              '--since=30 days ago',
              '--grep=^pin:',
              '--grep=^unpin:',
            ];

            let output = '';
            try {
              output = execFileSync('git', args, { encoding: 'utf8' }).trim();
            } catch {}

            const events = output
              .split('\n')
              .filter(Boolean)
              .map((line) => {
                const [sha, ...subject] = line.split('\t');
                const message = subject.join('\t');
                const match = message.match(/^(pin|unpin):\s*(.+?)(?:\s+[—-]\s+|$)/i);
                return match
                  ? { sha, subject: message, type: match[1].toLowerCase(), pkg: match[2].trim() }
                  : null;
              })
              .filter(Boolean);

            if (events.length === 0) {
              core.info('No pin/unpin commits to track.');
              return;
            }

            // git log is newest-first: the first event per package wins.
            const latest = new Map();
            for (const event of events) {
              if (!latest.has(event.pkg)) latest.set(event.pkg, event);
            }

            // Existing workflow-created issues, keyed by title.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
              per_page: 100,
            });
            const byTitle = new Map(
              issues.filter((i) => !i.pull_request).map((i) => [i.title, i]),
            );

            for (const event of latest.values()) {
              const { pkg, type } = event;
              const title = `Pinned: ${pkg}`;
              const existing = byTitle.get(title);

              if (type === 'unpin') {
                if (existing) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    state: 'closed',
                    state_reason: 'completed',
                  });
                  byTitle.delete(title);
                  core.info(`Closed #${existing.number}: ${title}`);
                } else {
                  core.info(`No open issue to close for ${pkg}.`);
                }
                continue;
              }

              const body =
                `## Pinned package: \`${pkg}\`\n\n` +
                `Commit: [\`${event.sha.slice(0, 8)}\`](${context.serverUrl}/` +
                `${context.repo.owner}/${context.repo.repo}/commit/${event.sha}) — ` +
                `${event.subject}\n\n` +
                `This package is pinned pending an upstream fix; the commit ` +
                `records the removal criterion. Remove the pin with an ` +
                `\`unpin: ${pkg} — ...\` commit to close this issue ` +
                `automatically.\n\n` +
                `*Opened automatically by the pin tracker.*`;

              if (existing) {
                if (existing.body === body) {
                  core.info(`Up to date: #${existing.number} ${title}`);
                } else {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    body,
                  });
                  core.info(`Updated #${existing.number}: ${title}`);
                }
              } else {
                const { data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['automated'],
                });
                byTitle.set(title, issue);
                core.info(`Created #${issue.number}: ${title}`);
              }
            }
