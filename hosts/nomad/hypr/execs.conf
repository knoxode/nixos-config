#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = hyprpanel
exec-once=waypaper --restore
exec-once=/home/shaiikura/.config/waypaper/autopicker.sh
exec-once = flatpak run com.discordapp.DiscordCanary --start-minimized
exec-once = ~/.config/hypr/start_monitor.sh >> ~/start-monitor.log
exec-once = ~/.config/hypr/handle_monitor_connect.sh >> ~/start-connect.log
exec-once = ~/.config/hypr/handle_monitor_disconnect.sh >> ~/start-disconnect.log
exec-once = hypridle
