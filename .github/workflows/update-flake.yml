name: Maintenance — Auto-update flake.lock

# Opens a lock-file-only PR once a day and arms auto-merge on it.
#
# nixpkgs follows github:NixOS/nixpkgs/nixos-unstable directly (flake.nix),
# so a lock update can adopt a revision whose packages are not yet in
# cache.nixos.org. The build jobs add the same third-party substituters the
# hosts use, including xddxdd's CachyOS kernel cache, so expensive inputs
# substitute instead of rebuilding from source (see docs/operations/ci.md).
# If a build still fails on missing upstream cache entries, pin the input or
# wait for Hydra/cache.nixos.org to catch up.
#
# When a non-nixpkgs input breaks the closure build, pin it to its
# last-known-good rev in flake.nix (the nixpkgs-snapgene pattern), regenerate
# the lock on the PR branch, and remove the pin once upstream fixes it.
#
# Requires a fine-grained personal access token (contents: read/write on this
# repo only) stored as the FLAKE_UPDATE_PAT secret. The default GITHUB_TOKEN
# would create the PR, but pushes made with it do not trigger other
# workflows, so Check would never run on the PR.
on:
  workflow_dispatch:
  schedule:
    # daily at 03:43 UTC, ahead of the daily Check run
    - cron: "43 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Open automated flake.lock PR
        id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ secrets.FLAKE_UPDATE_PAT }}
          pr-title: "chore: update flake.lock"
          pr-body: |
            Automated daily flake.lock update.

            CI evaluates all hosts against the new lock. Merge when green.
            If this PR is red, the new upstream revisions broke evaluation -
            consider pinning the offending input or fixing forward.
          pr-labels: |
            flake-lock
            automated

      # Merges the PR automatically once its required status checks are green.
      # Needs "Allow auto-merge" enabled in repo Settings, and branch
      # protection on main requiring the Check workflow's jobs - otherwise
      # auto-merge fires before anything is validated.
      - name: Arm auto-merge on lock PR
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
